name: Auto Create Pull Request

on:
  push:
    branches-ignore:
      - main
      - master

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if a PR already exists for this branch to prevent errors
          PR_EXISTS=$(gh pr list --head "${{ github.ref_name }}" --base main --json number --jq '.[0].number')
          
          if [ -z "$PR_EXISTS" ]; then
            gh pr create \
              --base main \
              --head "${{ github.ref_name }}" \
              --title "PR: Merge ${{ github.ref_name }} into main" \
              --body "This Pull Request was automatically created because a new branch was pushed.
              
              **Author:** @${{ github.actor }}
              **Branch:** \`${{ github.ref_name }}\`"
          else
            echo "A pull request already exists for this branch. Skipping creation."
          fi
