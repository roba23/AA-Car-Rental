name: Auto Create Pull Request

on:
  push:
    branches-ignore:
      - main
      - master

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    # This explicitly overrides UI settings and grants write access
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Auto-generated PR from pushed branch"
          branch: ${{ github.ref_name }}
          base: main 
          title: "PR: Merge ${{ github.ref_name }} into main"
          body: |
            This Pull Request was automatically created because a new branch was pushed.
            
            **Author:** @${{ github.actor }}
            **Branch:** `${{ github.ref_name }}`
